name: kdump-utils tests

on: [pull_request, workflow_dispatch]

jobs:
  tmt-e2e-tests:
    runs-on: ubuntu-latest

    concurrency:
        group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.fedora_version }}-${{ matrix.test }}
        cancel-in-progress: true
    strategy:
        matrix:
            fedora_version: [
                    "42"
            ]
        fail-fast: false

    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6

      - name: Install libvirt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients libvirt-dev pkg-config genisoimage
          sudo usermod -aG libvirt $USER
          sudo systemctl start libvirtd
          # verify KVM is available
          test -e /dev/kvm && echo "KVM OK" || echo "WARNING: /dev/kvm missing"
          sudo virsh list --all

      - name: Install tmt + testcloud
        run: |
          pip install --user tmt testcloud
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tmt --version

      - name: Run e2e test (${{ matrix.plan }})
        run: |
          cd tests && sg libvirt -c "tmt run -a --environment KDUMP_UTILS_RPM=kdump-utils provision -h virtual -c system -i fedora:43 plans --name lvm2_thinp"

      - name: Upload tmt artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tmt-run-${{ matrix.plan }}
          path: /var/tmp/tmt/run*
          if-no-files-found: ignore
